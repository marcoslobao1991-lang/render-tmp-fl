name: Render VSL

# Render da VSL VidroZap fora da máquina do Marcos, no mesmo esquema do
# render-ad.yml (que já provou sair certinho): N runners renderizam pedaços
# de VÍDEO mudo, um job renderiza o ÁUDIO inteiro de uma vez, o stitch emenda
# com setpts cravado e confere a contagem de frames antes de entregar.
#
# Diferença: o vídeo-fonte (master 1620×2880 com a voz tratada) NÃO fica no
# repositório — vem por URL (props.src), hospedado na VPS. Cada worker baixa
# uma vez. Os outros assets (telas do app, logos, strings) estão no git.
#
# O job de áudio não precisa dos pixels: `src_audio` aponta pra um vídeo LEVE
# com a mesma trilha (public/vsl/vsl-5722-audio-only.mp4, 26 MB, no git) —
# assim ele não depende de rede nenhuma. `chunks_from_run` reaproveita os
# chunk-* de um run anterior (só refaz áudio + emenda).
#
# No fim o stitch também gera a escada HLS (1080/720/540) + mp4 leve pro
# player próprio do site, prontos pra subir em media.srv1198551.hstgr.cloud.

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "id da composição"
        required: true
        default: "vidrozap-vsl"
      frames:
        description: "total de frames da composição (calcVSL5722Duration)"
        required: true
        default: "24555"
      src:
        description: "URL do vídeo-fonte (props.src)"
        required: true
        default: "https://media.srv1198551.hstgr.cloud/vsl-vidrozap/src/vsl-5722-hq.mp4"
      workers:
        description: "runners em paralelo"
        required: false
        default: "24"
      src_audio:
        description: "fonte só pro job de áudio (vazio = usa src). Pode ser caminho em public/"
        required: false
        default: "vsl/vsl-5722-audio-only.mp4"
      chunks_from_run:
        description: "id de um run anterior cujos chunk-* já saíram (pula o render de vídeo)"
        required: false
        default: ""
      audio_from_run:
        description: "id de um run anterior cujo artifact trilha já saiu (pula o render de áudio)"
        required: false
        default: ""
      props_json:
        description: 'props.json inteiro, pros casos de mais de uma fonte (ex.: VSL da Sofy, que tem duas partes). Vazio = usa src/src_audio.'
        required: false
        default: ""
      to_vps:
        description: "true = pedaços e trilha vão por scp pra VPS (sem artifacts); emenda é feita lá"
        required: false
        default: ""
      vps_dir:
        description: "pasta na VPS (/docker/media/files/<vps_dir>/chunks/<run>) quando to_vps=true"
        required: false
        default: "vsl-maestro"
      props_json_audio:
        description: "props.json do job de áudio (vazio = usa props_json, senão src_audio)"
        required: false
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        run: |
          WORKERS=${{ github.event.inputs.workers }}
          TOTAL=${{ github.event.inputs.frames }}
          CHUNK=$(( (TOTAL + WORKERS - 1) / WORKERS ))
          JSON="["
          for i in $(seq 0 $(( WORKERS - 1 ))); do
            START=$(( i * CHUNK ))
            END=$(( START + CHUNK ))
            if [ $END -gt $TOTAL ]; then END=$TOTAL; fi
            if [ $START -ge $TOTAL ]; then break; fi
            if [ "$JSON" != "[" ]; then JSON="$JSON,"; fi
            JSON="$JSON{\"index\":$i,\"start\":$START,\"end\":$END}"
          done
          JSON="$JSON]"
          echo "value=$JSON" >> "$GITHUB_OUTPUT"

  render:
    needs: setup
    if: ${{ github.event.inputs.chunks_from_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Props (src por URL)
        env:
          PROPS: ${{ github.event.inputs.props_json }}
        run: |
          if [ -n "$PROPS" ]; then printf '%s' "$PROPS" > props.json
          else printf '{"src":"%s"}' "${{ github.event.inputs.src }}" > props.json; fi
          cat props.json
      - name: Render chunk ${{ matrix.chunk.index }}
        run: |
          npx remotion render src/index.ts \
            "${{ github.event.inputs.composition }}" \
            "out/chunk-${{ matrix.chunk.index }}.mp4" \
            --props=props.json \
            --image-format=jpeg --jpeg-quality=95 --scale=1 \
            --timeout=900000 --concurrency=2 --muted \
            --frames=${{ matrix.chunk.start }}-$(( ${{ matrix.chunk.end }} - 1 ))
      - name: Enviar pedaço pra VPS
        if: ${{ github.event.inputs.to_vps == 'true' }}
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          DEST="/docker/media/files/${{ github.event.inputs.vps_dir }}/chunks/${{ github.run_id }}"
          ssh -i ~/.ssh/vps -o StrictHostKeyChecking=no root@72.60.55.24 "mkdir -p $DEST"
          scp -i ~/.ssh/vps -o StrictHostKeyChecking=no "out/chunk-${{ matrix.chunk.index }}.mp4" "root@72.60.55.24:$DEST/"
          ssh -i ~/.ssh/vps -o StrictHostKeyChecking=no root@72.60.55.24 "ls -la $DEST/chunk-${{ matrix.chunk.index }}.mp4"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.to_vps != 'true' }}
        continue-on-error: true
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: out/chunk-${{ matrix.chunk.index }}.mp4
          retention-days: 1

  # Áudio inteiro num job só (voz tratada + strings): trilha contínua, sem
  # emenda. Usa a fonte leve do git, então não depende da VPS.
  audio:
    if: ${{ github.event.inputs.audio_from_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 11/11: a VSL 6628 (33 min) estourou 120 min no áudio em 07/11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Props (fonte do áudio)
        env:
          PROPS_A: ${{ github.event.inputs.props_json_audio }}
          PROPS: ${{ github.event.inputs.props_json }}
        run: |
          if [ -n "$PROPS_A" ]; then printf '%s' "$PROPS_A" > props.json
          elif [ -n "$PROPS" ]; then printf '%s' "$PROPS" > props.json
          else
            SRC="${{ github.event.inputs.src_audio }}"
            if [ -z "$SRC" ]; then SRC="${{ github.event.inputs.src }}"; fi
            printf '{"src":"%s"}' "$SRC" > props.json
          fi
          cat props.json
      - name: Render áudio completo
        run: |
          npx remotion render src/index.ts \
            "${{ github.event.inputs.composition }}" \
            "out/trilha.wav" --codec=wav --props=props.json --timeout=300000 --concurrency=2
      - name: Enviar trilha pra VPS
        if: ${{ github.event.inputs.to_vps == 'true' }}
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          DEST="/docker/media/files/${{ github.event.inputs.vps_dir }}/chunks/${{ github.run_id }}"
          ssh -i ~/.ssh/vps -o StrictHostKeyChecking=no root@72.60.55.24 "mkdir -p $DEST"
          scp -i ~/.ssh/vps -o StrictHostKeyChecking=no out/trilha.wav "root@72.60.55.24:$DEST/"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.to_vps != 'true' }}
        continue-on-error: true
        with:
          name: trilha
          path: out/trilha.wav
          retention-days: 1

  stitch:
    needs: [setup, render, audio]
    if: ${{ always() && github.event.inputs.to_vps != 'true' && (needs.audio.result == 'success' || needs.audio.result == 'skipped') && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Chunks deste run
        if: ${{ github.event.inputs.chunks_from_run == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks/
      - name: Chunks de um run anterior
        if: ${{ github.event.inputs.chunks_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks/
          run-id: ${{ github.event.inputs.chunks_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trilha deste run
        if: ${{ github.event.inputs.audio_from_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: trilha
          path: trilha/
      - name: Trilha de um run anterior
        if: ${{ github.event.inputs.audio_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: trilha
          path: trilha/
          run-id: ${{ github.event.inputs.audio_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stitch chunks
        run: |
          WORKERS=${{ github.event.inputs.workers }}
          COMP="${{ github.event.inputs.composition }}"
          ESPERADO=${{ github.event.inputs.frames }}
          INPUTS=""; FILTRO=""; N=0
          for i in $(seq 0 $(( WORKERS - 1 ))); do
            FILE="chunks/chunk-$i/chunk-$i.mp4"
            if [ -f "$FILE" ]; then
              INPUTS="$INPUTS -i $FILE"; FILTRO="$FILTRO[$N:v]"; N=$(( N + 1 ))
            fi
          done
          echo "pedaços de vídeo: $N"
          # setpts=N/30/TB crava cada frame em N/30 (sem isso o concat duplica
          # frame na emenda); -frames:v garante a contagem exata.
          ffmpeg -y $INPUTS -i trilha/trilha.wav \
            -filter_complex "${FILTRO}concat=n=$N:v=1:a=0[vc];[vc]setpts=N/30/TB[v]" \
            -map "[v]" -map "$N:a" \
            -fps_mode passthrough -frames:v "$ESPERADO" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -video_track_timescale 30000 -movflags +faststart \
            "$COMP.mp4"
          REAL=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of csv=p=0 "$COMP.mp4")
          echo "frames: $REAL (esperado $ESPERADO)"
          if [ "$REAL" != "$ESPERADO" ]; then
            echo "ERRO: contagem de frames não bate com a composição."; exit 1
          fi
          ls -lh "$COMP.mp4"

      - name: Escada HLS + mp4 leve (pro player do site)
        run: |
          COMP="${{ github.event.inputs.composition }}"
          mkdir -p hls
          ffmpeg -y -i "$COMP.mp4" \
            -filter_complex "[0:v]split=3[a][b][c];[a]scale=1080:1920[v0];[b]scale=720:1280[v1];[c]scale=540:960[v2]" \
            -map "[v0]" -map 0:a -map "[v1]" -map 0:a -map "[v2]" -map 0:a \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -b:v:0 4200k -maxrate:v:0 4600k -bufsize:v:0 8400k \
            -b:v:1 2000k -maxrate:v:1 2200k -bufsize:v:1 4000k \
            -b:v:2 1000k -maxrate:v:2 1100k -bufsize:v:2 2000k \
            -c:a aac -b:a 128k -ac 2 \
            -f hls -hls_time 6 -hls_playlist_type vod -hls_flags independent_segments \
            -master_pl_name main.m3u8 \
            -var_stream_map "v:0,a:0,name:1080p v:1,a:1,name:720p v:2,a:2,name:540p" \
            -hls_segment_filename "hls/%v/seg_%04d.ts" "hls/%v/index.m3u8"
          # mp4 de fallback (1080p, leve)
          ffmpeg -y -i "$COMP.mp4" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ac 2 -movflags +faststart hls/vsl.mp4
          du -sh hls; cat hls/main.m3u8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition }}
          path: ${{ github.event.inputs.composition }}.mp4
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition }}-hls
          path: hls/
          retention-days: 7
